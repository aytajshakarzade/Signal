services:
  - type: web
    name: signal-studio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: DEV_EMAIL_MODE
        value: "false"
      - key: PORT
        value: "10000"
    disk:
      name: signal-studio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
